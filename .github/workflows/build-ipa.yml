name: Build unsigned IPA

# 用云端 macOS 编译「凡人放置」iOS 远程壳（ios-shell/），产出**未签名 IPA**
# （越狱设备 / TrollStore / Sideloadly 自签 均可安装）
#
# 产物去向：
#   1) Actions Artifact（网页可下）
#   2) 提交回仓库 ios-shell/dist-ipa/  —— 供 codeload.github.com 打包整仓下载

on:
  push:
    branches: [ main ]
    paths:
      - 'ios-shell/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ios-shell

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 工具链信息
        run: |
          sw_vers
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: 准备 AppIcon（b64 解码；缺图时 Pillow 兜底）
        run: |
          ICON_DIR="Sources/Assets.xcassets/AppIcon.appiconset"
          if [ -f AppIcon-1024.png.b64 ]; then
            python3 -c "import base64;open('$ICON_DIR/AppIcon-1024.png','wb').write(base64.b64decode(open('AppIcon-1024.png.b64','rb').read()))"
            echo "图标来源: b64 解码"
          fi
          if [ ! -s "$ICON_DIR/AppIcon-1024.png" ]; then
            python3 -m pip install --quiet pillow
            python3 <<'PY'
from PIL import Image, ImageDraw, ImageFont
im = Image.new('RGB', (1024, 1024), (9, 11, 12))
d = ImageDraw.Draw(im)
d.ellipse([142, 142, 882, 882], fill=(58, 44, 20))
d.ellipse([142, 142, 882, 882], outline=(216, 180, 90), width=10)
try:
    font = ImageFont.truetype('/System/Library/Fonts/Supplemental/Songti.ttc', 380)
except Exception:
    font = ImageFont.load_default()
d.text((512, 522), '凡', font=font, fill=(244, 227, 171), anchor='mm')
im.save('Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png', 'PNG')
print('fallback icon generated')
PY
            echo "图标来源: Pillow 兜底"
          fi
          ls -la "$ICON_DIR/"

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project FanrenFangzhi.xcodeproj \
            -scheme FanrenFangzhi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 打包 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/FanrenFangzhi.app"
          echo "--- app bundle ---"
          ls -la "$APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FanrenFangzhi-unsigned.ipa Payload
          mkdir -p dist-ipa
          cp FanrenFangzhi-unsigned.ipa dist-ipa/
          echo "--- ipa ---"
          ls -la dist-ipa/

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ios-shell/FanrenFangzhi-unsigned.ipa

      - name: 提交回仓库（供整仓归档下载）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist-ipa/FanrenFangzhi-unsigned.ipa
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "build: unsigned ipa [skip ci]"
            git push
          fi
