name: Build unsigned IPA

# 用云端 macOS 编译「凡人放置」iOS 远程壳（ios-shell/），产出**未签名 IPA**
# （越狱设备 / TrollStore / Sideloadly 自签 均可安装）
#
# 产物去向：
#   1) Actions Artifact（网页可下）
#   2) 提交回仓库 ios-shell/dist-ipa/ —— 供 codeload.github.com 打包整仓下载
#      （该电脑所在网络到 api.github.com / objects.githubusercontent.com 被墙，
#        所以产物必须走「提交回仓库」这条路取回）
#
# 注意：本文件里所有 run 块的内容必须缩进到 run: | 之下，
#       任何顶格（第 0 列）的行都会截断 YAML 块并导致 "Invalid workflow file"。

on:
  push:
    branches: [ main ]
    paths:
      - 'ios-shell/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ios-shell

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 初始化日志
        run: |
          mkdir -p dist-ipa
          : > dist-ipa/build.log
          {
            echo "== 环境信息 =="
            sw_vers
            xcodebuild -version
            echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version 2>&1)"
            echo "=============="
          } 2>&1 | tee -a dist-ipa/build.log

      - name: 检查 AppIcon
        run: |
          set -o pipefail
          ICON="Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          if [ -f AppIcon-1024.png.b64 ]; then
            python3 -c "import base64; open('$ICON','wb').write(base64.b64decode(open('AppIcon-1024.png.b64','rb').read()))"
            echo "图标来源: b64 解码"
          fi
          if [ ! -s "$ICON" ]; then
            echo "!! 缺少 AppIcon-1024.png"
            exit 1
          fi
          ls -la "$ICON"
          file "$ICON"
        # 注：图标 PNG 已随仓库提交，此处只做存在性校验，不再内嵌 heredoc。

      - name: 安装 XcodeGen
        run: |
          set -o pipefail
          brew install xcodegen 2>&1 | tee -a dist-ipa/build.log

      - name: 生成 Xcode 工程
        run: |
          set -o pipefail
          xcodegen generate --spec project.yml 2>&1 | tee -a dist-ipa/build.log

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project FanrenFangzhi.xcodeproj \
            -scheme FanrenFangzhi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee -a dist-ipa/build.log | tail -60

      - name: 打包 IPA
        run: |
          set -o pipefail
          APP="build/Build/Products/Release-iphoneos/FanrenFangzhi.app"
          {
            echo "--- app bundle ---"
            ls -la "$APP" || find build -name "*.app" -maxdepth 6
            echo "--- Info.plist 关键项 ---"
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :XXJHomeURL" "$APP/Info.plist" || true
            echo "--- 图标资源 ---"
            ls -la "$APP" | grep -i -E "AppIcon|Assets.car" || true
          } 2>&1 | tee -a dist-ipa/build.log
          if [ ! -d "$APP" ]; then
            echo "!! 没找到 .app"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FanrenFangzhi-unsigned.ipa Payload
          cp FanrenFangzhi-unsigned.ipa dist-ipa/
          {
            echo "--- ipa ---"
            ls -la dist-ipa/
            echo "--- sha256 ---"
            shasum -a 256 dist-ipa/FanrenFangzhi-unsigned.ipa
            echo "--- ipa 内部结构（前 20 行）---"
            unzip -l FanrenFangzhi-unsigned.ipa | head -20
          } 2>&1 | tee -a dist-ipa/build.log
          shasum -a 256 FanrenFangzhi-unsigned.ipa > dist-ipa/SHA256.txt

      - name: 上传 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ios-shell/dist-ipa/
          if-no-files-found: warn

      - name: 回传产物与日志到仓库（无论成败）
        if: always()
        run: |
          set -o pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "--- 待回传文件 ---"
          ls -la dist-ipa/
          git add -f dist-ipa/
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "build: ipa + build log [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "!! push 失败"
          fi
